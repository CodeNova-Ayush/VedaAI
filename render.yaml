# Render Blueprint for VedaAI backend.
#
# Single free Web Service that runs both the Express API and the BullMQ
# worker inside the same container (Render Background Workers require a
# paid plan, so we co-locate them via `concurrently`).
#
# Set MONGODB_URI, REDIS_URL, ANTHROPIC_API_KEY, and FRONTEND_URL in the
# Render dashboard (or when prompted by the Blueprint sync).

services:
  - type: web
    name: veda-ai-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
